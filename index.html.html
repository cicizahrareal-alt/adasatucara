        // Daftar warna untuk ikon agar tampil playful (warna-warni)
        const iconColors = [
            'text-blue-400', 'text-pink-400', 'text-purple-400', 'text-orange-400', 'text-teal-400'
        ];

        // Fungsi untuk me-render (menampilkan) folder ke layar
        function renderFolders(data) {
            const container = document.getElementById('folderContainer');
            const notFoundMsg = document.getElementById('notFoundMessage');
            
            // Bersihkan isi sebelumnya
            container.innerHTML = '';

            // Jika hasil pencarian kosong, tampilkan pesan
            if (data.length === 0) {
                notFoundMsg.classList.remove('hidden');
                return;
            } else {
                notFoundMsg.classList.add('hidden');
            }

            // Loop untuk membuat elemen setiap folder
            data.forEach((folder, index) => {
                // Pilih warna secara berurutan dari daftar warna
                const colorClass = iconColors[index % iconColors.length];
                
                // Jika link kosong (atau #), kita cegah klik
                const href = (folder.link && folder.link !== '#') ? folder.link : 'javascript:void(0)';
                const target = (folder.link && folder.link !== '#') ? '_blank' : '_self';

                // Format HTML Kartu
                const cardHTML = `
                    <a href="${href}" target="${target}" class="relative folder-card clay-card p-4 sm:p-6 flex flex-col items-center justify-center text-center group cursor-pointer hover:shadow-xl hover:-translate-y-1 transition-all duration-300">
                        <span class="absolute top-2 left-3 sm:top-3 sm:left-4 text-xs sm:text-sm font-black text-text-main">
                            ${folder.id}
                        </span>
                        <svg class="w-12 h-12 sm:w-16 sm:h-16 ${colorClass} mb-3 sm:mb-4 group-hover:scale-110 transition-transform duration-300 drop-shadow-sm" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path>
                        </svg>
                        <span class="folder-title font-bold text-xs min-[375px]:text-sm text-text-main leading-snug line-clamp-2">
                            ${folder.name}
                        </span>
                    </a>
                `;
                
                // Masukkan ke dalam container
                container.innerHTML += cardHTML;
            });
        }

        // Tampilkan semua data saat halaman pertama kali dibuka
        renderFolders(foldersData);

        // Fitur Pencarian (Search)
        const searchInput = document.getElementById('searchInput');
        
        searchInput.addEventListener('input', function(e) {
            const keyword = e.target.value.toLowerCase();
            
            // Saring (filter) data berdasarkan nama yang diketik
            const filteredData = foldersData.filter(folder => 
                folder.name.toLowerCase().includes(keyword)
            );
            
            // Render ulang dengan data yang sudah disaring
            renderFolders(filteredData);
        });

    </script>
